<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumo 메모리 카드</title>
  <style>
    :root {
      --accent: #1f4fb8;
      --accent-dark: #173d93;
      --tint-1: #6f9de6;
      --tint-2: #a9c6f2;
      --tint-3: #d6e4f8;
      --tint-4: #eef4fc;
      --text: #12203d;
      --muted: #4f5f7d;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(120deg, var(--white) 0%, var(--tint-4) 35%, var(--tint-3) 70%, var(--tint-2) 100%);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 회전한 사각형 장식 */
    .sq {
      position: fixed;
      transform: rotate(45deg);
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(31, 79, 184, 0.12);
      z-index: 0;
    }
    .sq-1 { width: 120px; height: 120px; top: -40px; right: 8%; background: var(--tint-2); opacity: .6; }
    .sq-2 { width: 70px; height: 70px; bottom: 10%; left: 4%; border: 2px dashed var(--tint-1); }
    .sq-3 { width: 36px; height: 36px; top: 30%; left: 10%; background: var(--accent); opacity: .15; }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 16px 48px;
    }

    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
    h1 span { color: var(--accent); }
    .sub { margin-top: 4px; color: var(--muted); font-size: 15px; }

    .stats {
      display: flex;
      gap: 12px;
      margin: 24px 0 16px;
    }
    .stat {
      flex: 1;
      padding: 10px 14px;
      background: var(--white);
      border-radius: 2px;
      outline: 1px dashed var(--tint-2);
      outline-offset: -5px;
      box-shadow: 0 6px 16px rgba(31, 79, 184, 0.1);
    }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 2.5vw, 12px);
      width: 100%;
      perspective: 900px;
    }

    .card {
      position: relative;
      aspect-ratio: 1;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
    }
    .card:focus-visible { outline: 3px solid var(--tint-1); outline-offset: 2px; }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .45s ease;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .back {
      background: var(--accent);
      outline: 1px dashed rgba(255, 255, 255, 0.6);
      outline-offset: -6px;
      box-shadow: 0 8px 18px rgba(31, 79, 184, 0.25);
    }
    /* 뒷면 가운데 회전 사각형 */
    .back::after {
      content: "";
      width: 26%;
      height: 26%;
      transform: rotate(45deg);
      background: var(--tint-2);
      opacity: .8;
    }
    .card:hover:not(.flipped):not(.matched) .back { background: var(--accent-dark); }

    .front {
      transform: rotateY(180deg);
      background: var(--white);
      outline: 1px dashed var(--tint-2);
      outline-offset: -6px;
      box-shadow: 0 8px 18px rgba(31, 79, 184, 0.15);
      font-size: clamp(26px, 9vw, 52px);
      line-height: 1;
    }
    .card.matched .front {
      background: var(--tint-4);
      outline: 2px solid var(--tint-1);
      outline-offset: -2px;
    }
    .card.matched { cursor: default; animation: pop .4s ease .35s; }
    @keyframes pop {
      50% { transform: scale(1.08); }
    }
    .card.wrong .front { background: #fff1f1; outline-color: #e9a3a3; }

    .actions { margin-top: 20px; text-align: center; }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: var(--white);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      outline: 1px dashed rgba(255, 255, 255, 0.6);
      outline-offset: -6px;
      box-shadow: 0 10px 24px rgba(31, 79, 184, 0.25);
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid var(--tint-2); outline-offset: 3px; }

    /* 완료 메시지 */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(18, 32, 61, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .dialog {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      text-align: center;
      background: var(--white);
      border-radius: 2px;
      outline: 1px dashed var(--tint-2);
      outline-offset: -8px;
      box-shadow: 0 20px 48px rgba(8, 24, 64, 0.3);
      transform: translateY(12px);
      transition: transform .3s;
    }
    .overlay.show .dialog { transform: none; }
    .dialog-mark {
      width: 28px; height: 28px;
      margin: 0 auto 16px;
      transform: rotate(45deg);
      background: var(--accent);
    }
    .dialog h2 { font-size: 22px; font-weight: 800; }
    .dialog p { margin: 8px 0 20px; color: var(--muted); }
    .dialog strong { color: var(--accent); }
  </style>
</head>
<body>
  <div class="sq sq-1"></div>
  <div class="sq sq-2"></div>
  <div class="sq sq-3"></div>

  <main class="wrap">
    <h1><span>Lumo</span> 메모리 카드</h1>
    <p class="sub">카드를 두 장씩 뒤집어 같은 그림을 찾아보세요.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">시도</div>
        <div class="stat-value" id="moves">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">시간</div>
        <div class="stat-value" id="time">00:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">맞춘 짝</div>
        <div class="stat-value" id="pairs">0/8</div>
      </div>
    </div>

    <div class="board" id="board" aria-label="카드 판"></div>

    <div class="actions">
      <button class="btn" id="restart" type="button">다시 시작</button>
    </div>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="done-title">
    <div class="dialog">
      <div class="dialog-mark"></div>
      <h2 id="done-title">모든 짝을 맞췄어요!</h2>
      <p><strong id="done-moves">0</strong>번 시도, <strong id="done-time">00:00</strong> 걸렸어요.</p>
      <button class="btn" id="again" type="button">다시 시작</button>
    </div>
  </div>

  <script>
    const EMOJIS = ["🍎", "🐳", "🚀", "🌻", "🎧", "🍩", "🦊", "⭐"];
    const TOTAL_PAIRS = EMOJIS.length;

    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const timeEl = document.getElementById("time");
    const pairsEl = document.getElementById("pairs");
    const overlay = document.getElementById("overlay");

    let open = [];       // 지금 뒤집혀 있는 (짝 미확정) 카드
    let lock = false;    // 틀린 두 장이 돌아가는 동안 입력 막기
    let moves = 0;
    let matched = 0;
    let seconds = 0;
    let timer = null;
    let started = false;
    let flipBackTimeout = null;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      return m + ":" + String(s % 60).padStart(2, "0");
    }

    function updateStats() {
      movesEl.textContent = moves;
      timeEl.textContent = formatTime(seconds);
      pairsEl.textContent = matched + "/" + TOTAL_PAIRS;
    }

    function startTimer() {
      started = true;
      timer = setInterval(() => { seconds++; updateStats(); }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function newGame() {
      stopTimer();
      clearTimeout(flipBackTimeout);
      open = [];
      lock = false;
      moves = 0;
      matched = 0;
      seconds = 0;
      started = false;
      overlay.classList.remove("show");
      updateStats();

      board.innerHTML = "";
      shuffle([...EMOJIS, ...EMOJIS]).forEach((emoji) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.emoji = emoji;
        card.setAttribute("aria-label", "뒤집힌 카드");
        card.innerHTML =
          '<span class="card-inner">' +
            '<span class="face back"></span>' +
            '<span class="face front">' + emoji + '</span>' +
          '</span>';
        card.addEventListener("click", () => flip(card));
        board.appendChild(card);
      });
    }

    function flip(card) {
      if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;
      if (!started) startTimer();

      card.classList.add("flipped");
      card.setAttribute("aria-label", card.dataset.emoji);
      open.push(card);
      if (open.length < 2) return;

      moves++;
      const [a, b] = open;
      open = [];

      if (a.dataset.emoji === b.dataset.emoji) {
        a.classList.add("matched");
        b.classList.add("matched");
        matched++;
        updateStats();
        if (matched === TOTAL_PAIRS) finish();
      } else {
        lock = true;
        updateStats();
        flipBackTimeout = setTimeout(() => {
          a.classList.add("wrong");
          b.classList.add("wrong");
          flipBackTimeout = setTimeout(() => {
            [a, b].forEach((c) => {
              c.classList.remove("flipped", "wrong");
              c.setAttribute("aria-label", "뒤집힌 카드");
            });
            lock = false;
          }, 500);
        }, 400);
      }
    }

    function finish() {
      stopTimer();
      document.getElementById("done-moves").textContent = moves;
      document.getElementById("done-time").textContent = formatTime(seconds);
      setTimeout(() => {
        overlay.classList.add("show");
        document.getElementById("again").focus();
      }, 700);
    }

    document.getElementById("restart").addEventListener("click", newGame);
    document.getElementById("again").addEventListener("click", newGame);

    newGame();
  </script>
</body>
</html>
